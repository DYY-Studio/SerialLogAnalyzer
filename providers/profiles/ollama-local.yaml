schema_version: 1
profile_id: ollama-local
adapter_id: openai-compatible
base_url: "http://localhost:11434/v1"
model: "qwen2.5:7b"
stream: true
request_timeout_seconds: 300

# 本地服务通常不校验密钥，但凭据来源必须是真实来源：
# 设一个非空环境变量即可（例如 OLLAMA_API_KEY=ollama）。
credential:
  kind: environment
  env_var: OLLAMA_API_KEY

extra_body: {}
extra_headers: {}
