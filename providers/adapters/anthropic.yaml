schema_version: 3
adapter_id: anthropic
endpoint: /messages
headers:
  x-api-key: ${api_key}
  anthropic-version: '2023-06-01'
  Content-Type: application/json
body:
  model: ${model}
  system: ${system}
  messages: ${messages}
  max_tokens: ${max_output_tokens}
  temperature: ${temperature}
  stream: ${stream}
messages_format: anthropic
response_content_pointer: /content/-1/text
models:
  endpoint: /models
  response_models_pointer: /data
  response_model_id: id
  response_model_display: display_name
usage:
  input_tokens_pointer: /usage/input_tokens
  output_tokens_pointer: /usage/output_tokens
  # Anthropic 的 input_tokens 不含缓存部分（官方口径：未被缓存读/写的输入），
  # 因此把 cache_read 与 cache_creation 求和计入输入；缓存命中只算 cache_read。
  input_extra_tokens_pointers:
  - /usage/cache_read_input_tokens
  - /usage/cache_creation_input_tokens
  input_cached_tokens_pointers:
  - /usage/cache_read_input_tokens
streaming:
  transport: sse
  endpoint: /messages
  request_body: {}
  content_events:
  - pointer: /delta/text
    when:
      pointer: /delta/type
      equals: text_delta
  reasoning_events: []
  terminal:
    when:
      pointer: /type
      equals: message_stop
  error_events:
  - when:
      pointer: /type
      equals: error
    message_pointer: /error/message
  usage:
    input_tokens_pointers:
    - /message/usage/input_tokens
    output_tokens_pointers:
    - /usage/output_tokens
    total_tokens_pointers: []
    input_extra_tokens_pointers:
    - /message/usage/cache_read_input_tokens
    - /message/usage/cache_creation_input_tokens
    input_cached_tokens_pointers:
    - /message/usage/cache_read_input_tokens
response_text_blocks_pointer: /content
default_max_output_tokens: 4096
