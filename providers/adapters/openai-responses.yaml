schema_version: 3
adapter_id: openai-responses
endpoint: /responses
headers:
  Authorization: Bearer ${api_key}
  Content-Type: application/json
body:
  model: ${model}
  input: ${messages}
  temperature: ${temperature}
  max_output_tokens: ${max_output_tokens}
  stream: ${stream}
  store: false
messages_format: openai
response_content_pointer: /output/-1/content/-1/text
models:
  endpoint: /models
  response_models_pointer: /data
  response_model_id: id
usage:
  input_tokens_pointer: /usage/input_tokens
  output_tokens_pointer: /usage/output_tokens
  total_tokens_pointer: /usage/total_tokens
  input_cached_tokens_pointers:
  - /usage/input_tokens_details/cached_tokens
streaming:
  transport: sse
  endpoint: /responses
  request_body: {}
  content_events:
  - pointer: /delta
    when:
      pointer: /type
      equals: response.output_text.delta
  reasoning_events: []
  terminal:
    when:
      pointer: /type
      equals: response.completed
  error_events:
  - when:
      pointer: /type
      equals: error
    message_pointer: /message
  - when:
      pointer: /type
      equals: response.failed
    message_pointer: /response/error/message
  - when:
      pointer: /type
      equals: response.incomplete
    message_pointer: /response/incomplete_details/reason
  usage:
    input_tokens_pointers:
    - /response/usage/input_tokens
    output_tokens_pointers:
    - /response/usage/output_tokens
    total_tokens_pointers:
    - /response/usage/total_tokens
    input_cached_tokens_pointers:
    - /response/usage/input_tokens_details/cached_tokens
response_text_blocks_pointer: /output
