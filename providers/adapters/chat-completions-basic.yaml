# OpenAI 兼容的基础 Chat Completions，不发送 stream_options 扩展。
schema_version: 3
adapter_id: chat-completions-basic
endpoint: /chat/completions
headers:
  Authorization: Bearer ${api_key}
  Content-Type: application/json
body:
  model: ${model}
  messages: ${messages}
  temperature: ${temperature}
  max_tokens: ${max_output_tokens}
  stream: ${stream}
messages_format: openai
response_content_pointer: /choices/0/message/content
response_reasoning_content_pointers:
- /choices/0/message/reasoning_content
- /choices/0/message/reasoning
models:
  endpoint: /models
  response_models_pointer: /data
  response_model_id: id
usage:
  input_tokens_pointer: /usage/prompt_tokens
  output_tokens_pointer: /usage/completion_tokens
  total_tokens_pointer: /usage/total_tokens
streaming:
  transport: sse
  endpoint: /chat/completions
  request_body: {}
  content_events:
  - pointer: /choices/0/delta/content
  reasoning_events:
  - pointer: /choices/0/delta/reasoning_content
  - pointer: /choices/0/delta/reasoning
  terminal:
    sentinel: '[DONE]'
  allow_clean_eof: false
  error_events: []
  usage:
    input_tokens_pointers:
    - /usage/prompt_tokens
    output_tokens_pointers:
    - /usage/completion_tokens
    total_tokens_pointers:
    - /usage/total_tokens
