[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serial-log-analyzer"
version = "0.1.0"
description = "Hi3861 串口日志实时分析与 LLM 辅助诊断桌面工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.7,<7",
    "PyYAML>=6,<7",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.6,<1",
]

[project.scripts]
serial-log-analyzer = "serial_log_analyzer.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serial_log_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"presets" = "serial_log_analyzer/resources/presets"
"providers" = "serial_log_analyzer/resources/providers"
"prompts" = "serial_log_analyzer/resources/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py311"
respect-gitignore = true
exclude = [".venv", "src/serial_log_analyzer/resources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
