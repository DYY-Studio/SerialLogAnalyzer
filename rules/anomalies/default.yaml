schema_version: 1
rule_set_id: default
display_name: "通用嵌入式异常规则"

defaults:
  window_seconds: 60
  cooldown_seconds: 60
  max_evidence: 20

rules:
  - rule_id: memory-alloc-failed
    category: "内存分配失败"
    severity: CRITICAL
    min_level: WARN
    keywords:
      - "malloc failed"
      - "out of memory"
      - "allocation failed"
      - "alloc failed"
      - "oom"
    immediate_alert: true
    min_occurrences: 1
    window_seconds: 60
    cooldown_seconds: 60

  - rule_id: watchdog-or-task-timeout
    category: "任务/调度超时"
    severity: HIGH
    min_level: WARN
    keywords:
      - "watchdog timeout"
      - "deadline exceeded"
      - "task timeout"
      - "wdt timeout"
    immediate_alert: true
    min_occurrences: 1
    window_seconds: 60
    cooldown_seconds: 60

  - rule_id: uart-rx-overflow
    category: "通信异常"
    severity: HIGH
    min_level: ERROR
    pattern: 'uart.*overflow|rx overflow'
    immediate_alert: false
    min_occurrences: 3
    window_seconds: 60
    cooldown_seconds: 60

  - rule_id: comm-link-failed
    category: "通信异常"
    severity: HIGH
    min_level: ERROR
    keywords:
      - "reconnect failed"
      - "link down"
      - "disconnect"
    immediate_alert: false
    min_occurrences: 1
    window_seconds: 60
    cooldown_seconds: 60

  - rule_id: comm-retry-burst
    category: "通信异常"
    severity: MEDIUM
    min_level: WARN
    keywords:
      - "retry "
    immediate_alert: false
    min_occurrences: 3
    window_seconds: 60
    cooldown_seconds: 60

  - rule_id: driver-peripheral-failed
    category: "驱动/外设错误"
    severity: HIGH
    min_level: WARN
    pattern: '(?:i2c|spi|gpio|sensor|flash).*failed|read failed|init failed'
    immediate_alert: false
    min_occurrences: 1
    window_seconds: 60
    cooldown_seconds: 60

  - rule_id: unclassified-error
    category: "其他/未知"
    severity: MEDIUM
    min_level: ERROR
    pattern: '.+'
    immediate_alert: false
    min_occurrences: 3
    window_seconds: 60
    cooldown_seconds: 60

# ---------------------------------------------------------------------------
# 可选示例：基于 Preset line.fields（LogEntry.extra）的数值阈值规则
# ---------------------------------------------------------------------------
# 说明：
# 1. 内置默认规则集不启用任何传感器数值阈值规则，避免因设备 Preset 字段不同造成误报；
#    如需启用，请在用户配置目录的 rules/anomalies/default.yaml 覆盖本文件，
#    并确保所用日志 Preset 已在 line.fields 中抽取对应字段（如 temperature）。
# 2. 规则按声明顺序匹配（首条命中生效）：若阈值规则也需匹配 ERROR 级别日志，
#    请放置在 unclassified-error 之前。
# 3. thresholds 列表中各条件为「与（AND）」关系；若同时声明了 keywords 或 pattern，
#    则须同时满足文本条件与全部数值阈值条件。支持操作符：gt / gte / lt / lte / eq / ne。
#
#   - rule_id: sensor-overheat
#     category: "传感器过温"
#     severity: HIGH
#     min_level: INFO
#     modules:
#       - "sensor"
#     thresholds:
#       - field: temperature
#         op: gt
#         value: 80.0
#     immediate_alert: false
#     min_occurrences: 3
#     window_seconds: 60
#     cooldown_seconds: 60
