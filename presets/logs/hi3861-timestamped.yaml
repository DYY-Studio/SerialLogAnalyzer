schema_version: 1
preset_id: hi3861-timestamped
display_name: "Hi3861 带板上时间戳"

line:
  # 板上先打印运行毫秒数，例如：
  #   [  12.345] [D] [wifi] scanning
  pattern: '^\[(?P<time>\s*\d+(?:\.\d+)?)\]\s*\[(?P<level>[A-Za-z]+)\]\s*\[(?P<module>[^\]]+)\]\s*(?P<message>.*)$'

  level_map:
    V: VERBOSE
    D: DEBUG
    I: INFO
    W: WARN
    E: ERROR

  continuation_pattern: '^\s+\S'

fallback:
  enabled: true
  level: UNKNOWN

prompt: |
  当前设备上下文：Hi3861 Wi-Fi SoC（FS-Hi3861-V4.2 开发板），运行基于 OpenHarmony LiteOS-M 的串口日志固件（UART0 115200-8-N-1）。
  - 日志格式：`[uptime_s] [LEVEL] [module] message`（行首为板上运行秒数，如 `[  12.345]`），级别含 `V`/`D`/`I`/`W`/`E`，行首空白缩进行为上一条日志的多行续行（如调用栈）。
  - 板载 I2C0 外设：SHT20 温湿度传感器（`temperature` °C、`humidity` %RH）、AP3216C 光照/接近/红外传感器（`light`/`proximity`/`infrared`）、PCF8574 IO 扩展芯片（P2 控制运行指示灯 LED2，每 500ms 翻转心跳；P0 为风扇且本固件不驱动恒为 0；P1 为蜂鸣器）。约每 3s 上报一次 `[I] [sensor]` 读数。
  - 命令通道：PC 下发文本命令后设备以 `@OK <payload>` 或 `@ERR <code> <msg>` 回复（独立于日志行），支持 `PING`、`VERSION`、`HELP` 与 `TEST <wifi|uart|gpio|memory|sensor|watchdog|all>`；`TEST` 仅输出可控模拟诊断日志（不引发真实死机、内存泄漏或硬件复位），分析时注意区分常规心跳、模拟自测与真实故障。

commands:
  - label: "PING"
    command: "PING"
    mode: send
    tooltip: "发送 PING 检查设备命令通道连通性"
  - label: "VERSION"
    command: "VERSION"
    mode: send
    tooltip: "查询固件版本号与芯片型号"
  - label: "HELP"
    command: "HELP"
    mode: send
    tooltip: "列出设备支持的全部命令"
  - label: "TEST …"
    command: "TEST "
    mode: prefill
    tooltip: "预填 TEST 前缀（可补充 wifi / uart / gpio / memory / sensor / watchdog / all）"
  - label: "TEST wifi"
    command: "TEST wifi"
    mode: send
    tooltip: "触发 Wi-Fi 扫描与重连失败自测日志"
  - label: "TEST all"
    command: "TEST all"
    mode: send
    tooltip: "依次触发全部模块自测日志序列"
