schema_version: 1
preset_id: hi3861-default
display_name: "Hi3861 默认日志"

line:
  # 支持两种行形态：
  #   [I] [wifi] connected to AP
  #   [1.234] [I] [wifi] connected to AP     （板上带时间戳的可选变体）
  pattern: '^\s*(?:\[(?P<time>[^\]]+)\]\s*)?\[(?P<level>[A-Za-z]+)\]\s*\[(?P<module>[^\]]+)\]\s*(?P<message>.*)$'

  level_map:
    V: VERBOSE
    D: DEBUG
    I: INFO
    W: WARN
    E: ERROR
    VERBOSE: VERBOSE
    DEBUG: DEBUG
    INFO: INFO
    WARN: WARN
    WARNING: WARN
    ERROR: ERROR
    FATAL: ERROR

  # 匹配该正则的行会被并入上一条日志（多行栈堆 / 后续缩进行）
  continuation_pattern: '^\s+\S'

  # 从 message 中抽取结构化字段（存入 LogEntry.extra），例如固件输出的 key=value：
  #   [I] [sensor] led=1 fan=0 temperature=29.7 humidity=43.6 ...
  fields:
    led: 'led=(?P<value>\d+)'
    fan: 'fan=(?P<value>\d+)'
    temperature: 'temperature=(?P<value>[\d.]+)'
    humidity: 'humidity=(?P<value>[\d.]+)'
    light: 'light=(?P<value>\d+)'
    proximity: 'proximity=(?P<value>\d+)'
    infrared: 'infrared=(?P<value>\d+)'

fallback:
  enabled: true
  level: UNKNOWN

commands:
  - label: "PING"
    command: "PING"
    mode: send
    tooltip: "发送 PING 检查设备命令通道连通性"
  - label: "VERSION"
    command: "VERSION"
    mode: send
    tooltip: "查询固件版本号与芯片型号"
  - label: "HELP"
    command: "HELP"
    mode: send
    tooltip: "列出设备支持的全部命令"
  - label: "TEST …"
    command: "TEST "
    mode: prefill
    tooltip: "预填 TEST 前缀（可补充 wifi / uart / gpio / memory / sensor / watchdog / all）"
  - label: "TEST wifi"
    command: "TEST wifi"
    mode: send
    tooltip: "触发 Wi-Fi 扫描与重连失败自测日志"
  - label: "TEST all"
    command: "TEST all"
    mode: send
    tooltip: "依次触发全部模块自测日志序列"
